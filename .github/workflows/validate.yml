name: Validation Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  # Chooses where the heavy jobs run: this PC (self-hosted runner, see Sebas1705/ci-runner) when its
  # heartbeat variable is under 3 minutes old, otherwise a GitHub-hosted runner. Only push and
  # workflow_dispatch may use the PC; pull requests never run on it.
  pick-runner:
    name: Pick the runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          HEARTBEAT: ${{ vars.PC_RUNNER_HEARTBEAT }}
          EVENT: ${{ github.event_name }}
        run: |
          runner='"ubuntu-latest"'
          if { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ -n "${HEARTBEAT:-}" ]; then
            age=$(( $(date +%s) - HEARTBEAT ))
            if [ "$age" -ge 0 ] && [ "$age" -lt 180 ]; then runner='["self-hosted","pc"]'; fi
          fi
          echo "Runner: $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      detekt: ${{ steps.filter.outputs.detekt }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            android:
              - 'app/**'
              - 'core/**'
              - 'data/**'
              - 'domain/**'
              - 'feature/**'
              - 'build-logic/**'
              - 'config/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/validate.yml'
            detekt:
              - 'app/**'
              - 'core/**'
              - 'data/**'
              - 'domain/**'
              - 'feature/**'
              - 'build-logic/**'
              - 'config/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/validate.yml'
            tests:
              - 'app/**'
              - 'core/**'
              - 'data/**'
              - 'domain/**'
              - 'feature/**'
              - 'build-logic/**'
              - 'config/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/validate.yml'
  build_lint:
    name: Build + Lint
    needs: [changes, pick-runner]
    if: needs.changes.outputs.android == 'true'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      # The PC image ships the Android cmdline-tools in /opt/android-sdk; GitHub-hosted images set this up themselves.
      - name: Locate the Android SDK
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          sdkmanager="$(command -v sdkmanager || ls "$sdk"/cmdline-tools/*/bin/sdkmanager | head -1)"
          # Accept the SDK licences so Gradle can download missing packages (best effort, may need sudo).
          yes | "$sdkmanager" --sdk_root="$sdk" --licenses >/dev/null 2>&1 || yes | sudo "$sdkmanager" --sdk_root="$sdk" --licenses >/dev/null 2>&1 || true
      # The PC image ships the Android cmdline-tools in /opt/android-sdk; GitHub-hosted images set this up themselves.
      - name: Locate the Android SDK
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          sdkmanager="$(command -v sdkmanager || ls "$sdk"/cmdline-tools/*/bin/sdkmanager | head -1)"
          # Accept the SDK licences so Gradle can download missing packages (best effort, may need sudo).
          yes | "$sdkmanager" --sdk_root="$sdk" --licenses >/dev/null 2>&1 || yes | sudo "$sdkmanager" --sdk_root="$sdk" --licenses >/dev/null 2>&1 || true
      - name: Create placeholder secrets
        run: |
          mkdir -p app
          echo "signing_keystore_password=fake" > app/secrets.properties
          echo "signing_key_alias=fake" >> app/secrets.properties
          echo "EXAMPLE_URL_DEV=https://dev.example.com" >> app/secrets.properties
          echo "EXAMPLE_URL_PRO=https://pro.example.com" >> app/secrets.properties
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build and Lint
        run: ./gradlew assembleDebug :app:lint --stacktrace --no-daemon --build-cache
      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          retention-days: 14
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
  detekt:
    name: Detekt
    needs: [changes, pick-runner]
    if: needs.changes.outputs.detekt == 'true'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Create placeholder secrets
        run: |
          mkdir -p app
          echo "signing_keystore_password=fake" > app/secrets.properties
          echo "signing_key_alias=fake" >> app/secrets.properties
          echo "EXAMPLE_URL_DEV=https://dev.example.com" >> app/secrets.properties
          echo "EXAMPLE_URL_PRO=https://pro.example.com" >> app/secrets.properties
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Detekt
        run: ./gradlew detekt --stacktrace --no-daemon --build-cache --configuration-cache
      - name: Upload Detekt Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          retention-days: 14
          path: |
            **/build/reports/detekt/
  unit_tests:
    name: Unit Tests + Coverage
    needs: [changes, pick-runner]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      # The PC image ships the Android cmdline-tools in /opt/android-sdk; GitHub-hosted images set this up themselves.
      - name: Locate the Android SDK
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          sdkmanager="$(command -v sdkmanager || ls "$sdk"/cmdline-tools/*/bin/sdkmanager | head -1)"
          # Accept the SDK licences so Gradle can download missing packages (best effort, may need sudo).
          yes | "$sdkmanager" --sdk_root="$sdk" --licenses >/dev/null 2>&1 || yes | sudo "$sdkmanager" --sdk_root="$sdk" --licenses >/dev/null 2>&1 || true
      - name: Create placeholder secrets
        run: |
          mkdir -p app
          echo "signing_keystore_password=fake" > app/secrets.properties
          echo "signing_key_alias=fake" >> app/secrets.properties
          echo "EXAMPLE_URL_DEV=https://dev.example.com" >> app/secrets.properties
          echo "EXAMPLE_URL_PRO=https://pro.example.com" >> app/secrets.properties
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Unit Tests and Coverage
        run: ./gradlew coverageUnitTestAll --stacktrace --no-daemon --build-cache
      - name: Post coverage to job summary
        if: always()
        run: |
          python3 - <<'EOF'
          import os
          import xml.etree.ElementTree as ET

          report_path = "build/reports/jacoco/merged/jacocoMergedReport.xml"
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          out.write("## Unit test coverage (JaCoCo, merged)\n\n")
          if not os.path.exists(report_path):
              out.write("Merged report not found: the tests failed before `jacocoMergedReport` ran.\n")
              raise SystemExit(0)

          report = ET.parse(report_path).getroot()
          counters = {c.get("type"): (int(c.get("covered")), int(c.get("missed"))) for c in report.findall("counter")}

          def pct(covered, missed):
              total = covered + missed
              return 0.0 if total == 0 else 100.0 * covered / total

          line_covered, line_missed = counters.get("LINE", (0, 0))
          out.write(f"**Total line coverage: {pct(line_covered, line_missed):.2f}%** "
                    f"({line_covered}/{line_covered + line_missed} lines)\n\n")
          out.write("| Counter | Covered | Missed | % |\n|---|---:|---:|---:|\n")
          for name in ("INSTRUCTION", "BRANCH", "LINE", "METHOD", "CLASS"):
              if name in counters:
                  covered, missed = counters[name]
                  out.write(f"| {name} | {covered} | {missed} | {pct(covered, missed):.2f} |\n")
          out.write("\nPer-module and merged HTML reports are in the `test-coverage-reports` artifact.\n")
          EOF
      - name: Upload Test and Coverage Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage-reports
          retention-days: 14
          path: |

            **/build/reports/tests/
            **/build/reports/jacoco/
