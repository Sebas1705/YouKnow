name: dependency-report-monthly

on:
  # Monthly, as its name and config/templates/dependency-report-monthly.workflow.yml.template say;
  # the template shipped it on every push and pull request instead.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate dependency report
        working-directory: .
        run: ./gradlew dependencyUpdates --no-parallel --no-daemon

      - name: Upload dependency report
        uses: actions/upload-artifact@v7
        with:
          name: dependency-updates-report
          path: build/dependencyUpdates/report.txt
