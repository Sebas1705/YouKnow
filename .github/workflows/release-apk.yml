name: Release APK

# The only distribution path: pushing a `vX.Y.Z` tag (or running this workflow by hand with a
# version) builds the signed Production release APK, creates a GitHub Release with the APK, its
# SHA-256 and notes generated from the PRs/commits since the previous tag, and uploads the same APK
# to Firebase App Distribution. Only what gets a tag reaches testers. Every secret comes from
# Doppler: GitHub only holds DOPPLER_TOKEN (read-only service token of youknow/prd).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without prefix, e.g. 1.2.0 (or 1.2.0-beta.1 for a pre-release)"
        required: true
        type: string

permissions:
  contents: write

# Never cancel a release halfway: two tags in a row queue up.
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then RAW="$INPUT_VERSION"; else RAW="$GITHUB_REF_NAME"; fi
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$RAW'. Expected X.Y.Z or X.Y.Z-suffix (e.g. 1.2.0, 1.2.0-beta.1)"
            exit 1
          fi
          TAG="v$VERSION"
          if [ "$EVENT" = "workflow_dispatch" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Pick another version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=" >> "$GITHUB_OUTPUT" ;; esac

      - uses: ./.github/actions/build-release-apk
        with:
          version-name: ${{ steps.ver.outputs.version }}
          extra-secrets: FIREBASE_SERVICE_ACCOUNT_JSON

      - name: Prepare release assets
        id: assets
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          APK="YouKnow-$TAG.apk"
          cp app/build/outputs/apk/Production/release/app-Production-release.apk "$RUNNER_TEMP/$APK"
          (cd "$RUNNER_TEMP" && sha256sum "$APK" > "$APK.sha256")
          echo "apk=$RUNNER_TEMP/$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$RUNNER_TEMP/$APK.sha256" >> "$GITHUB_OUTPUT"

      # A pushed tag gets the release attached to it (--verify-tag); a manual run lets `gh` create
      # the tag on the run's commit (--target).
      - name: Create the GitHub Release
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
          APK: ${{ steps.assets.outputs.apk }}
          SHA: ${{ steps.assets.outputs.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then REF_FLAG="--target $GITHUB_SHA"; else REF_FLAG="--verify-tag"; fi
          # shellcheck disable=SC2086
          gh release create "$TAG" "$APK" "$SHA" --title "$TAG" --generate-notes $PRERELEASE $REF_FLAG

      - name: Upload to Firebase App Distribution
        env:
          TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP || 'testers' }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          export NOTES="$TAG: $(git log -1 --pretty='%s (%h)')"
          doppler run -- bash -c '
            umask 077
            printf "%s" "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
            npx --yes firebase-tools appdistribution:distribute app/build/outputs/apk/Production/release/app-Production-release.apk \
              --app "$FIREBASE_APP_ID" \
              --groups "$TESTER_GROUP" \
              --release-notes "$NOTES"'

      - name: Remove credentials from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/firebase-sa.json" app/google-services.json
