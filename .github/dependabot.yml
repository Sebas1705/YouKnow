version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
      - "gradle"
    ignore:
      # protobuf stays on 3.x while Firebase does: 4.x lite clashes with protolite-well-known-types
      # (duplicate classes). See `protobuf` in gradle/libs.versions.toml.
      - dependency-name: "com.google.protobuf:*"
        update-types: ["version-update:semver-major"]
      # Major Android Gradle Plugin upgrades need a migration; they come from the Templetry template
      # (templetry update), not from here.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools:*"
        update-types: ["version-update:semver-major"]
      # The Gradle wrapper moves together with AGP (a newer Gradle drops internal APIs that the
      # current AGP uses, e.g. Gradle 9.6 with AGP 8.13), so it also comes from the template.
      - dependency-name: "gradle-wrapper"
      # Hilt 2.59+ requires AGP 9, so it waits for the same template migration.
      - dependency-name: "com.google.dagger*"
        versions: [">= 2.59"]
    groups:
      # One reviewable PR for minor and patch updates; majors (not ignored above) come one by one.
      gradle-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/firebase/rules-test"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      rules-test:
        patterns:
          - "*"
