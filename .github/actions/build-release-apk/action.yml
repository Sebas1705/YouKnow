name: Build signed release APK
description: >
  Builds `:app:assembleProductionRelease` signed with the fixed release keystore. Every secret comes
  from Doppler (the job must export DOPPLER_TOKEN and check out the repo first). Writes
  app/google-services.json from Doppler so the Crashlytics plugin injects its build id and uploads
  the R8 mapping. The APK ends up at app/build/outputs/apk/Production/release/app-Production-release.apk.

inputs:
  version-name:
    description: versionName of the APK (e.g. 1.2.0). Empty falls back to the value in app/build.gradle.kts.
    required: false
    default: ""
  extra-secrets:
    description: >
      Additional Doppler secrets the calling workflow needs (space separated), on top of the
      build and signing ones that are always checked.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: dopplerhq/cli-action@v4

    - name: Check that Doppler has every secret
      shell: bash
      env:
        EXTRA_SECRETS: ${{ inputs.extra-secrets }}
      run: |
        [ -n "$DOPPLER_TOKEN" ] || { echo "::error::Missing the DOPPLER_TOKEN secret in GitHub"; exit 1; }
        doppler run -- bash -c '
          missing=0
          for name in FIREBASE_APP_ID FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_SENDER_ID \
                      FIREBASE_STORAGE_BUCKET FIREBASE_DATABASE_URL GOOGLE_WEB_CLIENT_ID \
                      SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD \
                      $EXTRA_SECRETS; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing secret $name in Doppler"; missing=1; fi
          done
          exit $missing'

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21

    - uses: gradle/actions/setup-gradle@v6

    - name: Prepare keystore and Firebase config
      shell: bash
      run: |
        doppler run -- bash -c 'umask 077; printf "%s" "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"'
        echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        doppler run -- bash scripts/write-google-services-json.sh

    # Signing, version and Firebase values reach Gradle as environment variables (doppler run);
    # see `secret` in the root build.gradle.kts.
    - name: Build the release APK
      shell: bash
      env:
        VERSION_CODE: ${{ github.run_number }}
        VERSION_NAME: ${{ inputs.version-name }}
      run: |
        chmod +x gradlew
        doppler run -- ./gradlew :app:assembleProductionRelease --no-daemon --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
